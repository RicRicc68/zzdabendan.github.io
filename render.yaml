services:
  - type: web
    name: polymarket-live-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_WALLET
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: polymarket-arb-bot
    env: node
    plan: free
    rootDir: arb-bot
    buildCommand: npm install
    # LIVE dal 2026-07-21 (terzo tentativo). POLY_FUNDER era stato cambiato
    # per errore in 0xA5D6a77... (non autorizzato, ogni ordine falliva).
    # Ripristinato 0x8a421653819CC5f004D6aBdB763b1E61073b41E3, l'unico
    # indirizzo con prove concrete di funzionamento (ordini reali riusciti
    # nella sessione del 2026-07-20).
    startCommand: node server.js --live
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: bybit-pump-scanner
    env: node
    plan: free
    rootDir: bybit-scanner
    buildCommand: npm install
    startCommand: node server.js
    # Nessuna chiave API: solo dati di mercato pubblici, nessun ordine.
    # PROXY_URL serve solo perché Bybit blocca l'IP datacenter di Render
    # (403), vedi config.js e ../deploy/aws_spain_proxy/.
    envVars:
      - key: PROXY_URL
        sync: false
