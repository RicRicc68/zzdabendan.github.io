services:
  - type: web
    name: polymarket-live-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_WALLET
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: polymarket-arb-bot
    env: node
    plan: free
    rootDir: arb-bot
    buildCommand: npm install
    # Tornato a dry-run il 2026-07-21: dopo il fix del POLY_FUNDER (indirizzo
    # sbagliato, corretto in 0xA5D6a7776713c4bd2DF7c25480AFF2aA9f26FE8e), ogni
    # ordine falliva con "the order signer address has to be the address of
    # the API KEY" - la chiave privata non risulta autorizzata a firmare per
    # quel funder su Polymarket (va collegata/importata lato loro, non basta
    # l'env var). Nessun fondo perso (tutti i tentativi falliti in sicurezza
    # prima dell'esecuzione). Rimettere "--live" solo dopo aver verificato il
    # collegamento wallet su Polymarket.
    startCommand: node server.js
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: bybit-pump-scanner
    env: node
    plan: free
    rootDir: bybit-scanner
    buildCommand: npm install
    startCommand: node server.js
    # Nessuna chiave API: solo dati di mercato pubblici, nessun ordine.
    # PROXY_URL serve solo perché Bybit blocca l'IP datacenter di Render
    # (403), vedi config.js e ../deploy/aws_spain_proxy/.
    envVars:
      - key: PROXY_URL
        sync: false
