services:
  - type: web
    name: polymarket-live-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_WALLET
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: polymarket-arb-bot
    env: node
    plan: free
    rootDir: arb-bot
    buildCommand: npm install
    # LIVE dal 2026-07-21 (secondo tentativo). Il primo (2026-07-20) e' stato
    # fermato dopo poche ore: -$23.69 su 8 trade, causato da un guardrail sul
    # capitale committed mancante (fix in questo stesso repo) e da segnali
    # troppo rumorosi (soglia MIN_MOVE_BPS alzata da 5 a 10). Con la soglia
    # nuova: 22 trade in dry-run, 90.9% win rate, +$12.93. Per tornare a
    # dry-run: rimuovi "--live".
    startCommand: node server.js --live
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: bybit-pump-scanner
    env: node
    plan: free
    rootDir: bybit-scanner
    buildCommand: npm install
    startCommand: node server.js
    # Nessuna chiave API: solo dati di mercato pubblici, nessun ordine.
    # PROXY_URL serve solo perché Bybit blocca l'IP datacenter di Render
    # (403), vedi config.js e ../deploy/aws_spain_proxy/.
    envVars:
      - key: PROXY_URL
        sync: false
