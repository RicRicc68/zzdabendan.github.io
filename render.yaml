services:
  - type: web
    name: polymarket-live-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_WALLET
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: polymarket-arb-bot
    env: node
    plan: free
    rootDir: arb-bot
    buildCommand: npm install
    # LIVE dal 2026-07-20: capitale reale, wallet dedicato.
    # Passato dopo ~3.5 giorni di dry-run (295 trade, 81% win rate,
    # +$98.11 P&L simulato corretto). Per tornare a dry-run: rimuovi "--live".
    startCommand: node server.js --live
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: bybit-pump-scanner
    env: node
    plan: free
    rootDir: bybit-scanner
    buildCommand: npm install
    startCommand: node server.js
    # Nessuna chiave API: solo dati di mercato pubblici, nessun ordine.
    # PROXY_URL serve solo perché Bybit blocca l'IP datacenter di Render
    # (403), vedi config.js e ../deploy/aws_spain_proxy/.
    envVars:
      - key: PROXY_URL
        sync: false
