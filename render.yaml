services:
  - type: web
    name: polymarket-live-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_WALLET
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: polymarket-arb-bot
    env: node
    plan: free
    rootDir: arb-bot
    buildCommand: npm install
    # Dry-run: NIENTE --live. Logga solo i segnali, nessun ordine reale.
    # Passare a live cambiando questo comando in "node server.js --live"
    # solo dopo aver verificato i segnali nei log.
    startCommand: node server.js
    envVars:
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_FUNDER
        sync: false
      - key: POLY_SIGNATURE_TYPE
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: PROXY_URL
        sync: false

  - type: web
    name: bybit-pump-scanner
    env: node
    plan: free
    rootDir: bybit-scanner
    buildCommand: npm install
    startCommand: node server.js
    # Nessuna chiave API: solo dati di mercato pubblici, nessun ordine.
    # PROXY_URL serve solo perché Bybit blocca l'IP datacenter di Render
    # (403), vedi config.js e ../deploy/aws_spain_proxy/.
    envVars:
      - key: PROXY_URL
        sync: false
